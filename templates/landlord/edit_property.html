{% extends "base.html" %}

{% block title %}Edit Property - UniStay{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row">
        <div class="col-md-10 mx-auto">
            <div class="card shadow-sm">
                <div class="card-header bg-warning">
                    <h4 class="mb-0"><i class="fas fa-edit"></i> Edit Property</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <!-- Basic Information -->
                        <div class="row mb-3">
                            <div class="col-md-12">
                                <label class="form-label">Property Title</label>
                                <input type="text" name="title" class="form-control" value="{{ property.title }}" required>
                            </div>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Property Type</label>
                                <select name="property_type" class="form-select" required>
                                    <option value="bedsitter" {% if property.property_type == 'bedsitter' %}selected{% endif %}>Bedsitter</option>
                                    <option value="single_room" {% if property.property_type == 'single_room' %}selected{% endif %}>Single Room</option>
                                    <option value="one_bedroom" {% if property.property_type == 'one_bedroom' %}selected{% endif %}>One Bedroom</option>
                                    <option value="two_bedroom" {% if property.property_type == 'two_bedroom' %}selected{% endif %}>Two Bedroom</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Status</label>
                                <select name="status" class="form-select" required>
                                    <option value="available" {% if property.status == 'available' %}selected{% endif %}>Available</option>
                                    <option value="occupied" {% if property.status == 'occupied' %}selected{% endif %}>Occupied</option>
                                    <option value="reserved" {% if property.status == 'reserved' %}selected{% endif %}>Reserved</option>
                                    <option value="under_maintenance" {% if property.status == 'under_maintenance' %}selected{% endif %}>Under Maintenance</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea name="description" class="form-control" rows="4" required>{{ property.description }}</textarea>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Monthly Rent (KES)</label>
                                <input type="number" name="monthly_rent" class="form-control" value="{{ property.monthly_rent }}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Available Units</label>
                                <input type="number" name="available_units" class="form-control" value="{{ property.available_units }}" min="0" required>
                            </div>
                        </div>
                        
                        <div class="text-end">
                            <a href="{{ url_for('landlord.properties') }}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Update Property</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
