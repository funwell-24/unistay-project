{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow text-center">
                <div class="card-body p-5">
                    <i class="fas fa-envelope fa-4x text-primary mb-4"></i>
                    <h3>Verify Your Email Address</h3>
                    <p class="text-muted">We've sent a verification link to your email address. Please check your inbox and click the link to verify your account.</p>
                    <hr>
                    <p>Didn't receive the email? <a href="#">Resend verification email</a></p>
                    <a href="{{ url_for('auth.login') }}" class="btn btn-primary">Return to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
