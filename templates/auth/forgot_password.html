{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h3 class="mb-0"><i class="fas fa-key"></i> Forgot Password</h3>
                </div>
                <div class="card-body">
                    <p class="text-muted">Enter your email address and we'll send you a link to reset your password.</p>
                    <form method="POST" action="{{ url_for('auth.forgot_password') }}">
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" name="email" class="form-control form-control-lg" required placeholder="Enter your registered email">
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100">Send Reset Link</button>
                    </form>
                    <hr>
                    <div class="text-center">
                        <p><a href="{{ url_for('auth.login') }}">Back to Login</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
