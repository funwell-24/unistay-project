{% extends "base.html" %}

{% block title %}Report Listing - UniStay{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0"><i class="fas fa-flag"></i> Report Listing</h4>
                </div>
                <div class="card-body">
                    <div class="alert alert-warning">
                        <i class="fas fa-exclamation-triangle"></i>
                        Please provide accurate information. False reports may lead to account suspension.
                    </div>
                    
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Property</label>
                            <input type="text" class="form-control" value="{{ property.title }}" disabled>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Report Type</label>
                            <select name="report_type" class="form-select" required>
                                <option value="">Select report type</option>
                                <option value="fake_listing">Fake Listing</option>
                                <option value="scam">Scam/Fraud</option>
                                <option value="misleading_info">Misleading Information</option>
                                <option value="price_mismatch">Price Mismatch</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea name="description" class="form-control" rows="6" required 
                                      placeholder="Please provide detailed information about why you're reporting this listing..."></textarea>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('property_detail', property_id=property.id) }}" class="btn btn-secondary">
                                Cancel
                            </a>
                            <button type="submit" class="btn btn-danger">
                                <i class="fas fa-paper-plane"></i> Submit Report
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
