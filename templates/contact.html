{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row">
        <div class="col-lg-6 mx-auto text-center mb-5">
            <h1>Contact Us</h1>
            <p class="lead">We'd love to hear from you. Send us a message and we'll respond as soon as possible.</p>
        </div>
    </div>
    
    <div class="row">
        <div class="col-md-6 mb-4">
            <div class="card">
                <div class="card-body">
                    <h4><i class="fas fa-envelope text-primary"></i> Send us a Message</h4>
                    <form method="POST" action="{{ url_for('contact') }}">
                        <div class="mb-3">
                            <label class="form-label">Your Name</label>
                            <input type="text" name="name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Subject</label>
                            <input type="text" name="subject" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Message</label>
                            <textarea name="message" rows="5" class="form-control" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Send Message</button>
                    </form>
                </div>
            </div>
        </div>
        
        <div class="col-md-6 mb-4">
            <div class="card">
                <div class="card-body">
                    <h4><i class="fas fa-map-marker-alt text-primary"></i> Contact Information</h4>
                    <hr>
                    <p><i class="fas fa-map-marker-alt me-2 text-primary"></i> Nairobi, Kenya</p>
                    <p><i class="fas fa-phone me-2 text-primary"></i> +254 700 000000</p>
                    <p><i class="fas fa-envelope me-2 text-primary"></i> info@unistay.com</p>
                    <p><i class="fas fa-clock me-2 text-primary"></i> Monday - Friday: 8 AM - 6 PM</p>
                    
                    <hr>
                    <h5>Follow Us</h5>
                    <div class="mt-3">
                        <a href="#" class="btn btn-outline-primary me-2"><i class="fab fa-facebook-f"></i></a>
                        <a href="#" class="btn btn-outline-info me-2"><i class="fab fa-twitter"></i></a>
                        <a href="#" class="btn btn-outline-danger me-2"><i class="fab fa-instagram"></i></a>
                        <a href="#" class="btn btn-outline-primary"><i class="fab fa-linkedin-in"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
